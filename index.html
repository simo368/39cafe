<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f7f4" />
  <meta name="description" content="39 Café & Bistrot - Menù digitale con aggiornamenti in tempo reale su piatti, bibite e disponibilità." />

  <title>Il menu — 39 Café & Bistrot</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page" id="public-menu-container">

    <header class="brand">
      <div class="brand-photo" id="brand-photo-wrap">
        <img id="brand-hero-img" src="cover.jpg" alt="39 Café & Bistrot" />
      </div>

      <div class="brand-mark" id="brand-logo-mark">39</div>
      <h1 id="brand-hero-title">39 Café & Bistrot</h1>
      <p id="brand-hero-subtitle">Caffetteria speciale, cucina artigianale & aperitivi d'autore</p>

      <div class="brand-meta">
        <span id="brand-address-text"></span>
        <span id="brand-wifi-text"></span>
      </div>
    </header>

    <section class="controls" aria-label="Ricerca e filtri">
      <input
        type="search"
        id="search-input"
        class="search"
        placeholder="Cerca un piatto, una bevanda, un ingrediente"
        autocomplete="off"
        aria-label="Cerca nel menu"
      />

      <div class="chips" id="diet-filter-chips">
        <button class="chip active" data-diet="all">Tutti</button>
        <button class="chip" data-diet="veg">Vegetariano</button>
        <button class="chip" data-diet="vegan">Vegano</button>
        <button class="chip" data-diet="glutenFree">Senza glutine</button>
      </div>
    </section>

    <div class="menu-label">
      <h2>Il menu</h2>
      <span class="live" id="live-indicator-badge" title="Menu sincronizzato in tempo reale">
        <span class="live-dot online" id="live-dot"></span>
        <span id="live-status-text">In diretta</span>
      </span>
    </div>

    <div id="categories-content-container">
      <div class="loading">Caricamento del menu…</div>
    </div>

    <footer class="footer">
      Per informazioni sugli allergeni, chiedi al personale di sala.<br />
      © 39 Café & Bistrot<br />
      <a class="admin-link" href="admin.html">Gestione menu</a>
    </footer>

  </main>

  <div class="toast-container" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
