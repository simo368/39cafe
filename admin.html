<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f7f4" />
  <meta name="robots" content="noindex, nofollow" />
  
  <title>Gestione menu — 39 Café & Bistrot</title>

  <!-- Foglio di Stile Minimal Paper & Ink -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Schermata di Sblocco PIN (se non autenticato) -->
  <div id="admin-auth-screen" style="display: none; padding: 60px 15px;">
    <div class="modal" style="margin: auto; max-width: 380px; text-align: center;">
      <div class="brand-mark" style="margin-top: 5px;">39</div>
      <h2 style="margin-bottom: 6px;">Area Ristorante</h2>
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 20px;">
        Inserisci il PIN del ristorante per modificare prezzi, disponibilità e piatti in tempo reale.
      </p>

      <form id="admin-pin-login-form">
        <input 
          type="password" 
          id="admin-standalone-pin-input" 
          placeholder="••••" 
          maxlength="8" 
          style="text-align: center; font-size: 26px; letter-spacing: 6px; padding: 10px; margin-bottom: 8px;"
          autofocus
        />
        <p style="font-size: 11px; color: var(--muted); margin-bottom: 18px;">
          PIN predefinito: <strong>3939</strong>
        </p>

        <div style="display: flex; gap: 8px;">
          <a href="index.html" class="btn" style="flex: 1;">← Menu</a>
          <button type="submit" class="btn primary" style="flex: 1;">Entra</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Dashboard Admin Principale (visibile dopo PIN) -->
  <main class="admin" id="admin-dashboard-screen" style="display: none;">
    <!-- Popolato dinamicamente da admin.js -->
  </main>

  <!-- Contenitore Notifiche Toast -->
  <div class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
