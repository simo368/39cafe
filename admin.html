<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f7f4" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Gestione menu — 39 Café & Bistrot</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Accesso con PIN -->
  <div id="admin-auth-screen" class="auth" style="display: none;">
    <div class="auth-card">
      <div class="brand-mark">39</div>
      <h1>Gestione menu</h1>
      <p>Inserisci il PIN per modificare piatti, prezzi e disponibilità.</p>

      <form id="admin-pin-login-form">
        <input
          type="password"
          id="admin-standalone-pin-input"
          class="pin-input"
          placeholder="••••"
          maxlength="8"
          autocomplete="off"
          aria-label="PIN"
          autofocus
        />
        <div class="auth-actions">
          <a href="index.html" class="btn">Torna al menu</a>
          <button type="submit" class="btn primary">Entra</button>
        </div>
      </form>

      <p class="auth-hint">PIN predefinito: 3939</p>
    </div>
  </div>

  <!-- Dashboard (popolata da admin.js) -->
  <main class="admin" id="admin-dashboard-screen" style="display: none;"></main>

  <div class="toast-container" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
